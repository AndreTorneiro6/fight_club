name: Validate and deploy Fight Club

on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main, deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fight-club-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install local photo processor
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - run: npm run typecheck
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm run build
      # ubuntu-24.04 already provides the shared libraries needed for headless
      # Chromium. Avoid reinstalling fonts/Xvfb and upgrading system libraries
      # from a slow apt mirror on every run; the browser tests remain mandatory.
      - name: Install Chromium for browser checks
        run: npx playwright install chromium
      - run: npx playwright test e2e/seasons.spec.ts e2e/workspaces.spec.ts e2e/sticker-album.spec.ts e2e/coins.spec.ts e2e/sponsors.spec.ts e2e/gamification.spec.ts e2e/global-search.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

  deploy:
    if: github.ref == 'refs/heads/deploy' && github.event_name != 'pull_request'
    needs: checks
    runs-on: [self-hosted, Linux, ARM64, fight-club-production]
    timeout-minutes: 30
    environment:
      name: production
      url: https://fight-club.wbglabs.io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and deploy directly on the Raspberry Pi
        run: bash scripts/deploy-production.sh "$GITHUB_WORKSPACE"
      - name: Verify public health
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://fight-club.wbglabs.io/api/health
