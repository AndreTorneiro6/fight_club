name: Validate and deploy Fight Club

on:
  push:
    branches: [main, deploy]
  pull_request:
    branches: [main, deploy]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fight-club-${{ github.ref }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install local photo processor
        run: sudo apt-get update && sudo apt-get install -y python3-pil
      - run: npm run typecheck
      - run: npm test
        env:
          TMPDIR: ${{ runner.temp }}
      - run: npm run build
      # ubuntu-24.04 already provides the shared libraries needed for headless
      # Chromium. Avoid reinstalling fonts/Xvfb and upgrading system libraries
      # from a slow apt mirror on every run; the browser tests remain mandatory.
      - name: Install Chromium for browser checks
        run: npx playwright install chromium
      - run: npx playwright test e2e/workspaces.spec.ts e2e/sticker-album.spec.ts e2e/coins.spec.ts e2e/sponsors.spec.ts e2e/gamification.spec.ts e2e/global-search.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Check original personal cromo artwork and PNG export
        run: npx playwright test e2e/personal-cromo.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}
      # A fresh demo database keeps aggregate logins below the production rate limit.
      - name: Check admin court availability and hidden player calendar
        run: npx playwright test e2e/admin-overview.spec.ts e2e/court-availability.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check spectator assignment, both admin previews and spectator predictions
        run: npx playwright test e2e/spectator.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}
          DEMO_TEST_ADMIN_PAIR: "1"

      - name: Check consistent nearest-first games and player calendar visibility
        run: npx playwright test e2e/match-ordering.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check frozen title and normal match layouts
        run: npx playwright test e2e/frozen-matches.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check Title Fight template layout and mobile spectators
        run: npx playwright test e2e/title-fight-layout.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check shared team song and private team chat
        run: npx playwright test e2e/team-space.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check admin pending official results
        run: npx playwright test e2e/admin-pending-results.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}
          DEMO_TEST_ROUND_TRANSITION: "1"

      - name: Check match images and clipboard exports
        run: npx playwright test e2e/image-sharing.spec.ts e2e/poster-templates.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check guided division turnover, private papers and player calendars
        run: npx playwright test e2e/round-transition.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}
          DEMO_TEST_ROUND_TRANSITION: "1"

      - name: Check neutral production registration responses
        run: npx playwright test e2e/registration-security.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}
          DEMO_TEST_PRODUCTION_AUTH: "1"

      - name: Check authentication recovery and photograph authorization
        run: npx playwright test e2e/security-regressions.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check private unlockable photographs
        run: npx playwright test e2e/club-photos.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check private match voting and discussion
        run: npx playwright test e2e/match-voting.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check player betting release and notification navigation
        run: npx playwright test e2e/player-betting.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check official results and betting settlement
        run: npx playwright test e2e/official-betting-results.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check challenge chat mentions
        run: npx playwright test e2e/chat-mentions.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}
          DEMO_TEST_ROUND_TRANSITION: "1"

      - name: Check season administration and start announcements
        run: npx playwright test e2e/seasons.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Check placement imports and private simulations
        run: npx playwright test e2e/placement-simulation.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check notifications between two test administrators
        run: npx playwright test e2e/shared-admin-tests.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}
          DEMO_TEST_ADMIN_PAIR: "1"

      - name: Check role-based challenges and per-set official results
        run: npx playwright test e2e/role-challenges.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check independent season and competition status labels
        run: npx playwright test e2e/competition-season-status.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check weekly ranking publication and player notifications
        run: npx playwright test e2e/weekly-ranking.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check published upcoming-week roles and scheduled opening
        run: npx playwright test e2e/upcoming-week-challenges.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check shared partner challenge actions
        run: npx playwright test e2e/team-challenges.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check direct administrator scheduling without player proposals
        run: npx playwright test e2e/admin-direct-scheduling.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check Bronze distance and dynamic team role assignments
        run: npx playwright test e2e/dynamic-weekly.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check division opening clocks and immediate distance controls
        run: npx playwright test e2e/challenge-opening-clock.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check player league agenda and season first-week navigation
        run: npx playwright test e2e/player-agenda.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check team ranks and champion presentation
        run: npx playwright test e2e/team-rankings.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Check team weekly role approval and publication
        run: npx playwright test e2e/weekly-teams.spec.ts
        env:
          TMPDIR: ${{ runner.temp }}

  deploy:
    if: github.ref == 'refs/heads/deploy' && github.event_name != 'pull_request'
    needs: checks
    runs-on: [self-hosted, Linux, ARM64, fight-club-production]
    timeout-minutes: 30
    environment:
      name: production
      url: https://fight-club.wbglabs.io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Build and deploy directly on the Raspberry Pi
        run: bash scripts/deploy-production.sh "$GITHUB_WORKSPACE"
      - name: Verify public health
        run: curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 https://fight-club.wbglabs.io/api/health
