# Raspberry Pi deployment that reuses the existing Traefik instance and ACME store.
# Combine with compose.production.yaml for every command on the Pi.
services:
  traefik:
    profiles:
      - standalone-proxy

  mongo:
    networks:
      - data
      - shared-mongo

  app:
    labels:
      - traefik.docker.network=web-app_default
      - traefik.http.routers.fightclub.tls.certresolver=letsencrypt

networks:
  shared-mongo:
    external: true
    name: wbglabs_data
  proxy:
    external: true
    name: web-app_default
